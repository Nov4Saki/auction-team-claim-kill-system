name: GuildCore
version: '1.0.0'
main: com.guildcore.GuildCorePlugin
api-version: '1.21'
author: Antigravity
description: Dual-compatible, combat-hardened all-in-one team, teleportation, trade & economy plugin for Paper, Folia, Spigot, and Bukkit 1.21.11
folia-supported: true

commands:
  coins:
    description: Check your coin balance
    aliases: [bal, balance, money]
  pay:
    description: Pay coins to another player
    usage: /pay <player> <amount>
  eco:
    description: Admin economy control
    permission: guildcore.admin
  claim:
    description: Claim land and manage claim options
    aliases: [land]
    usage: /claim [auto|map|flags]
  unclaim:
    description: Unclaim the current chunk
  trust:
    description: Grant trust level to a player in your claim
    usage: /trust <access|container|build|manager> <player>
  untrust:
    description: Remove trust from a player in your claim
    usage: /untrust <player>
  team:
    description: Team management system
    aliases: [t, guild, g, teams]
  tc:
    description: Send team chat message
    aliases: [teamchat, gc, guildchat]
  ah:
    description: Open the Auction House
    aliases: [auction, auctions]
  stats:
    description: View player kill statistics and leaderboards
    aliases: [stat, leaderboard]
  bounty:
    description: Set or view bounties
    aliases: [bounties]
  guildcore:
    description: Master plugin command and debug controls
    permission: guildcore.admin
    aliases: [debug, gcore]
  settings:
    description: Master admin configuration GUI
    permission: guildcore.admin
    aliases: [setting, config]
  tpa:
    description: Send a teleport request to another player
    usage: /tpa <player>
  tpaccept:
    description: Accept a pending teleport request
  tpdeny:
    description: Deny a pending teleport request
  rtp:
    description: Randomly teleport to a safe surface location in the wilderness
  spawn:
    description: Teleport to server spawn
  setspawn:
    description: Set server spawn location
    permission: guildcore.admin
  sethome:
    description: Set a personal home location
    usage: /sethome [name]
  home:
    description: Teleport to a personal home location
    usage: /home [name]
  delhome:
    description: Delete a personal home location
    usage: /delhome [name]
  warp:
    description: Teleport to a server warp
    usage: /warp <name>
  setwarp:
    description: Set a server warp
    permission: guildcore.admin
    usage: /setwarp <name>
  delwarp:
    description: Delete a server warp
    permission: guildcore.admin
    usage: /delwarp <name>
  trade:
    description: Request or accept a player-to-player trade
    usage: /trade <player|accept>

permissions:
  guildcore.admin:
    description: Full administrative access to GuildCore
    default: op
