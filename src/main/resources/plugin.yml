name: GuildCore
version: '1.0.0'
main: com.guildcore.GuildCorePlugin
api-version: '1.21'
author: Antigravity
description: Dual-compatible, combat-hardened all-in-one team, teleportation, trade, crates, shop & economy plugin for Paper, Folia, Spigot, and Bukkit 1.21.11
folia-supported: true

commands:
  coins:
    description: Check your coin balance
    aliases: [bal, balance, money]
  pay:
    description: Pay coins to another player
    usage: /pay <player> <amount>
  eco:
    description: Admin economy control
    permission: guildcore.admin
  claim:
    description: Claim land and manage claim options
    aliases: [land]
    usage: /claim [auto|map|flags]
  unclaim:
    description: Unclaim the current chunk
  guild:
    description: Guild management system
    aliases: [team, g, t, teams]
  tc:
    description: Send guild chat message
    aliases: [teamchat, gc, guildchat]
  ah:
    description: Open the Auction House
    aliases: [auction, auctions]
  stats:
    description: View player kill statistics and leaderboards
    aliases: [stat]
  leaderboard:
    description: View player and guild leaderboards GUI
    aliases: [lb]
  bounty:
    description: Set or view bounties
    aliases: [bounties]
  guildcore:
    description: Master plugin command and debug controls
    permission: guildcore.admin
    aliases: [debug, gcore]
  settings:
    description: Master admin configuration GUI
    permission: guildcore.admin
    aliases: [setting, config]
  tpa:
    description: Send a teleport request to another player
    aliases: [gctpa]
    usage: /tpa <player>
  tpaccept:
    description: Accept a pending teleport request
    aliases: [gctpaccept]
  tpdeny:
    description: Deny a pending teleport request
    aliases: [gctpdeny]
  rtp:
    description: Randomly teleport to a safe surface location in the wilderness
  spawn:
    description: Teleport to server spawn
  setspawn:
    description: Set server spawn location
    permission: guildcore.admin
  warp:
    description: Teleport to a server warp
    usage: /warp <name>
  setwarp:
    description: Set a server warp
    permission: guildcore.admin
    usage: /setwarp <name>
  delwarp:
    description: Delete a server warp
    permission: guildcore.admin
    usage: /delwarp <name>
  trade:
    description: Request, accept, or deny a player-to-player trade
    usage: /trade <player|accept|deny>
  crate:
    description: Modular choice crates system
    aliases: [crates]
    usage: /crate [open|givekey|create|edit]
  shop:
    description: Server-wide buy/sell shop
    aliases: [store]
    usage: /shop [additem]

permissions:
  guildcore.admin:
    description: Full administrative access to GuildCore
    default: op
  guildcore.leaderboard:
    description: Access to view leaderboards GUI
    default: true
  guildcore.home.bypasscooldown:
    description: Bypass cooldown for guild home teleports
    default: op
